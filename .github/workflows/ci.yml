name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# NFR-008: Linux, Windows, and macOS are all first class. A feature is not done
# until it is green on all three, or the gap is documented in release notes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # D20: coverage thresholds are enforced, not merely reported.
      - name: Test with coverage
        run: pnpm run test:coverage

      - name: Traceability
        run: pnpm run trace -- --check

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # D9: distribution is a per-OS bundle, not a single portable binary.
      # Proving that assembles and runs on every OS from M0 keeps packaging
      # from becoming an end-of-project surprise.
      - name: Assemble bundle
        shell: bash
        run: node scripts/package.mjs
        env:
          PENTRACKR_COMMIT: ${{ github.sha }}

      - name: Smoke test the bundle
        shell: bash
        run: node dist-bundle/pentrackr/bin/pentrackr.js --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pentrackr-${{ matrix.os }}
          path: dist-bundle/*.tar.gz
          if-no-files-found: error
