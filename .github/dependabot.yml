# Actions are pinned to commit SHAs (supply-chain hardening), which means they
# do not update on their own. Pinning without an update path is how a repository
# ends up running a two-year-old action, so the two go together: SHAs for
# determinism, Dependabot to move them deliberately.
#
# Grouping is split by update type on purpose. An earlier version grouped
# everything with patterns: ["*"], and the first batch it produced was four
# simultaneous major bumps — checkout v4 to v7, setup-node v4 to v7,
# upload-artifact v4 to v7, gitleaks-action v2 to v3 — as a single
# accept-or-reject pull request. That batch happened to be one coherent change
# (the Node 20 runtime deprecation), but the shape was luck rather than design:
# four unrelated breaking changes would have arrived the same way, and the only
# options would have been to take all of them or none.
#
# So minor and patch updates group into one quiet pull request, and majors are
# left ungrouped: one pull request per dependency, each carrying a single diff
# its release notes can be read against.
#
# Ungrouped is not the same as sequential — several major pull requests can be
# open at once. The point is that each can be taken or refused on its own merits,
# not that they arrive one after another.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Security advisories still open their own pull request regardless of
      # grouping, which is the signal worth interrupting for.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
